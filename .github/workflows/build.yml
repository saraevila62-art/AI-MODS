name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Скачиваем gradlew, так как его нет в архиве автора
      - name: Download Gradle Wrapper
        run: |
          curl -sL https://raw.githubusercontent.com/neoformnet/neoforge-template/main/gradlew -o gradlew
          chmod +x gradlew
          
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miyu-jar
          path: build/libs/*.jar
