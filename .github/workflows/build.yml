name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # Устанавливаем современный Gradle напрямую из официального источника
      - name: Install Modern Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip gradle-8.9-bin.zip
          sudo mv gradle-8.9 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH
          
      # Генерируем wrapper с нужной версией
      - name: Generate Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Generating gradle wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          
      - name: Setup Gradle Action
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miyu-jar
          path: build/libs/*.jar
